plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def uploadProperties = new Properties()
def uploadPropertiesPath = System.getenv('KETUA_UPLOAD_PROPERTIES')
if (uploadPropertiesPath) {
    file(uploadPropertiesPath).withInputStream { uploadProperties.load(it) }
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !uploadPropertiesPath) {
    throw new GradleException('Release builds require KETUA_UPLOAD_PROPERTIES pointing to the private upload signing configuration.')
}

android {
    compileSdk 36

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.sanyu.ketua"
        minSdkVersion 24
        targetSdkVersion 36
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (uploadPropertiesPath) {
            upload {
                keyAlias uploadProperties['keyAlias']
                keyPassword uploadProperties['keyPassword']
                storeFile file(uploadProperties['storeFile'])
                storePassword uploadProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig uploadPropertiesPath ? signingConfigs.upload : null
        }
    }
    namespace 'com.sanyu.ketua'
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.android.support:multidex:1.0.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
